name: CI/CD Frontend - QA Deployment

on:
  push:
    branches: [qa]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oscarmtz17-coachprime-frontend-qa

permissions:
  contents: read

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug environment and secrets
        run: |
          echo "Environment: ${{ github.event.deployment.environment }}"
          echo "Job environment: ${{ vars.ENVIRONMENT }}"
          echo "QA_HOST from secrets: ${{ secrets.QA_HOST }}"
          echo "QA_USERNAME from secrets: ${{ secrets.QA_USERNAME }}"
          echo "QA_PORT from secrets: ${{ secrets.QA_PORT }}"
          echo "QA_HOST length: ${#QA_HOST}"
          echo "QA_USERNAME length: ${#QA_USERNAME}"
          echo "QA_SSH_KEY length: ${#QA_SSH_KEY}"
          echo "QA_PORT length: ${#QA_PORT}"

      - name: Deploy to QA Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USERNAME }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_PORT }}
          script: |
            # Limpiar directorio si existe
            rm -rf /opt/coachprime-qa-frontend
            mkdir -p /opt/coachprime-qa-frontend
            cd /opt/coachprime-qa-frontend

            # Clonar repositorio
            git clone https://github.com/oscarmtz17/coachPrimeFrontend.git .
            git checkout qa

            # Crear archivo .env con las variables de entorno
            cat > .env << EOF
            REACT_APP_ENVIRONMENT=qa
            REACT_APP_API_BASE_URL=http://${{ secrets.QA_HOST }}:5000/api
            REACT_APP_STRIPE_PUBLISHABLE_KEY=pk_test_51Oscarmtz17
            REACT_APP_APP_NAME=CoachPrime QA
            REACT_APP_VERSION=1.0.0
            EOF

            # Construir y ejecutar
            docker-compose -f docker-compose.qa.yml down || true
            docker-compose -f docker-compose.qa.yml build --no-cache
            docker-compose -f docker-compose.qa.yml up -d

      - name: Health Check
        run: |
          echo "Checking backend health first..."
          curl -f http://${{ secrets.QA_HOST }}:5000/health || echo "Backend not responding, but continuing..."

          echo "Waiting for frontend to be ready..."
          sleep 60
          echo "Checking frontend health..."
          curl -f http://${{ secrets.QA_HOST }}:3000/health || {
            echo "Frontend not responding, checking container status..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@${{ secrets.QA_HOST }} "docker ps -a && docker logs coachprime-qa-frontend"
            exit 1
          }
          echo "Frontend is healthy!"
