name: CI/CD Frontend - QA Deployment

on:
  push:
    branches: [qa]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oscarmtz17-coachprime-frontend-qa

permissions:
  contents: read

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug SSH secrets
        run: |
          echo "QA_HOST length: ${#QA_HOST}"
          echo "QA_USERNAME length: ${#QA_USERNAME}"
          echo "QA_SSH_KEY length: ${#QA_SSH_KEY}"
          echo "QA_PORT length: ${#QA_PORT}"
          echo "QA_HOST: ${{ secrets.QA_HOST }}"
          echo "QA_USERNAME: ${{ secrets.QA_USERNAME }}"
          echo "QA_PORT: ${{ secrets.QA_PORT }}"

      - name: Deploy to QA Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USERNAME }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_PORT }}
          script: |
            # Crear directorio si no existe
            mkdir -p /opt/coachprime-qa-frontend

            # Ir al directorio
            cd /opt/coachprime-qa-frontend

            # Clonar repositorio si no existe
            if [ ! -d ".git" ]; then
              git clone https://github.com/oscarmtz17/coachPrimeFrontend.git .
              git checkout qa
            else
              git pull origin qa
            fi

            # Construir y ejecutar
            docker-compose -f docker-compose.qa.yml down
            docker-compose -f docker-compose.qa.yml build --no-cache
            docker-compose -f docker-compose.qa.yml up -d

      - name: Health Check
        run: |
          sleep 30
          curl -f http://${{ secrets.QA_HOST }}:3000 || exit 1
