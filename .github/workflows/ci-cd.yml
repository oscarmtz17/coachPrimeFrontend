name: CI/CD Frontend - QA Deployment

on:
  push:
    branches: [qa]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oscarmtz17-coachprime-frontend-qa

permissions:
  contents: read

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug environment and secrets
        run: |
          echo "Environment: ${{ github.event.deployment.environment }}"
          echo "Job environment: ${{ vars.ENVIRONMENT }}"
          echo "QA_HOST from secrets: ${{ secrets.QA_HOST }}"
          echo "QA_USERNAME from secrets: ${{ secrets.QA_USERNAME }}"
          echo "QA_PORT from secrets: ${{ secrets.QA_PORT }}"
          echo "QA_HOST length: ${#QA_HOST}"
          echo "QA_USERNAME length: ${#QA_USERNAME}"
          echo "QA_SSH_KEY length: ${#QA_SSH_KEY}"
          echo "QA_PORT length: ${#QA_PORT}"

      - name: Deploy to QA Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USERNAME }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_PORT }}
          script: |
            # Limpiar directorio si existe
            rm -rf /opt/coachprime-qa-frontend
            mkdir -p /opt/coachprime-qa-frontend
            cd /opt/coachprime-qa-frontend

            # Clonar repositorio
            git clone https://github.com/oscarmtz17/coachPrimeFrontend.git .
            git checkout qa

            # Construir y ejecutar
            docker-compose -f docker-compose.qa.yml down || true
            docker-compose -f docker-compose.qa.yml build --no-cache
            docker-compose -f docker-compose.qa.yml up -d

      - name: Health Check
        run: |
          sleep 30
          curl -f http://${{ secrets.QA_HOST }}:3000 || exit 1
