version: "3.8"
services:
  frontend:
    image: ghcr.io/oscarmtz17/coachprime-frontend:latest
    container_name: coachprime-qa-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REACT_APP_STRIPE_PUBLISHABLE_KEY=${REACT_APP_STRIPE_PUBLISHABLE_KEY}
    networks:
      - coachprime-qa-network
    restart: unless-stopped

networks:
  coachprime-qa-network:
    external: true
